<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Delivery History - Delivery Driver</title>
    <link rel="stylesheet" href="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/css/bootstrap.min.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.3/css/all.min.css">
    <style>
        body {
            background-color: #f8f9fa;
        }
        .wrapper {
            display: flex;
            width: 100%;
            align-items: stretch;
        }
        #sidebar {
            min-width: 250px;
            max-width: 250px;
            background: #343a40;
            color: #fff;
            transition: all 0.3s;
        }
        #sidebar.active {
            margin-left: -250px;
        }
        #sidebar .sidebar-header {
            padding: 20px;
            background: #343a40;
        }
        #sidebar ul.components {
            padding: 20px 0;
            border-bottom: 1px solid #47748b;
        }
        #sidebar ul li a {
            padding: 10px;
            font-size: 1.1em;
            display: block;
            color: #e0e0e0;
        }
        #sidebar ul li a:hover {
            color: #fff;
            background: #ff5722;
            text-decoration: none;
        }
        #content {
            width: 100%;
            padding: 20px;
            min-height: 100vh;
            transition: all 0.3s;
        }
        .table img {
            max-width: 50px;
            max-height: 50px;
            border-radius: 5px;
        }
    </style>
</head>
<body>
    <div class="wrapper">
        <!-- Sidebar -->
        <nav id="sidebar">
            <div class="sidebar-header">
                <h3>Delivery Driver</h3>
            </div>
            <ul class="list-unstyled components">
                <li>
                    <a href="delivery_dashboard.html"><i class="fas fa-tachometer-alt"></i> Dashboard</a>
                </li>
                <li>
                    <a href="assigned_orders.html"><i class="fas fa-clipboard-list"></i> Assigned Orders</a>
                </li>
                <li class="active">
                    <a href="delivery_history.html"><i class="fas fa-history"></i> Delivery History</a>
                </li>
                <li>
                    <a href="earnings.html"><i class="fas fa-money-bill-wave"></i> Earnings</a>
                </li>
                <li>
                    <a href="profile.html"><i class="fas fa-user"></i> Profile</a>
                </li>
                <li>
                    <a href="/webtechnologies/FoodBox/backend/logout.php"><i class="fas fa-sign-out-alt"></i> Logout</a>
                </li>
            </ul>
        </nav>

        <!-- Page Content -->
        <div id="content">
            <nav class="navbar navbar-expand-lg navbar-light bg-light">
                <div class="container-fluid">
                    <button type="button" id="sidebarCollapse" class="btn btn-info">
                        <i class="fas fa-align-left"></i>
                        <span>Toggle Sidebar</span>
                    </button>
                    <div class="ml-auto">
                        <h4>Welcome, Driver Name!</h4>
                    </div>
                </div>
            </nav>

            <h2>Delivery History</h2>
            <p class="lead">A record of all your past deliveries.</p>

            <div class="card mt-4">
                <div class="card-header">
                    Filter History
                </div>
                <div class="card-body">
                    <form class="form-inline">
                        <div class="form-group mb-2 mr-2">
                            <label for="startDate" class="sr-only">Start Date</label>
                            <input type="date" class="form-control" id="startDate">
                        </div>
                        <div class="form-group mb-2 mr-2">
                            <label for="endDate" class="sr-only">End Date</label>
                            <input type="date" class="form-control" id="endDate">
                        </div>
                        <button type="submit" class="btn btn-primary mb-2"><i class="fas fa-filter"></i> Apply Filter</button>
                    </form>
                </div>
            </div>

            <div class="table-responsive mt-4">
                <table class="table table-striped table-hover">
                    <thead>
                        <tr>
                            <th>Order ID</th>
                            <th>Date</th>
                            <th>Time</th>
                            <th>Restaurant</th>
                            <th>Customer</th>
                            <th>Delivery Address</th>
                            <th>Status</th>
                            <th>Earnings</th>
                            <th>Actions</th>
                        </tr>
                    </thead>
                    <tbody id="history-tbody">
                    </tbody>
                </table>
            </div>

        </div>
    </div>

    <script src="https://code.jquery.com/jquery-3.5.1.slim.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@popperjs/core@2.5.4/dist/umd/popper.min.js"></script>
    <script src="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/js/bootstrap.min.js"></script>
    <script>
        $(document).ready(function () {
            $('#sidebarCollapse').on('click', function () {
                $('#sidebar').toggleClass('active');
            });

            // Load initial
            loadHistory();

            // Filter form submit
            $('form').on('submit', function (e) {
                e.preventDefault();
                loadHistory();
            });
        });

        async function loadHistory() {
            const start = document.getElementById('startDate').value;
            const end = document.getElementById('endDate').value;
            const params = new URLSearchParams();
            if (start) params.append('start', start);
            if (end) params.append('end', end);

            try {
                const resp = await fetch(`/webtechnologies/FoodBox/backend/api/delivery/get_history.php?${params.toString()}`, { credentials: 'include' });
                const raw = await resp.text();
                let data; try { data = JSON.parse(raw); } catch { data = null; }
                const tbody = document.getElementById('history-tbody');
                tbody.innerHTML = '';

                if (resp.ok && data && data.success && Array.isArray(data.history)) {
                    if (data.history.length === 0) {
                        tbody.innerHTML = `<tr><td colspan="9" class="text-center text-muted">No records found</td></tr>`;
                        return;
                    }
                    data.history.forEach(row => {
                        const dt = new Date(row.created_at);
                        const date = dt.toISOString().slice(0,10);
                        const time = dt.toTimeString().slice(0,5);
                        const statusBadge = row.status === 'cancelled' ? 'badge-danger' : 'badge-success';
                        const tr = document.createElement('tr');
                        tr.innerHTML = `
                            <td>#${row.id}</td>
                            <td>${date}</td>
                            <td>${time}</td>
                            <td>${row.restaurant_name}</td>
                            <td>${row.customer_name}</td>
                            <td>${row.delivery_address}</td>
                            <td><span class="badge ${statusBadge}">${row.status.replace(/_/g,' ')}</span></td>
                            <td>$${parseFloat(row.earning).toFixed(2)}</td>
                            <td><button class="btn btn-sm btn-info"><i class="fas fa-info-circle"></i> Details</button></td>
                        `;
                        tbody.appendChild(tr);
                    });
                } else if (resp.status === 401) {
                    tbody.innerHTML = `<tr><td colspan="9" class="text-center text-danger">Please log in as delivery driver</td></tr>`;
                } else {
                    const msg = data && (data.error_detail || data.error) ? `${data.error}${data.error_detail ? ' - ' + data.error_detail : ''}` : raw || `HTTP ${resp.status}`;
                    tbody.innerHTML = `<tr><td colspan="9" class="text-center text-danger">Failed to load history: ${msg}</td></tr>`;
                }
            } catch (err) {
                console.error('History load error:', err);
                const tbody = document.getElementById('history-tbody');
                tbody.innerHTML = `<tr><td colspan="9" class="text-center text-danger">Network/server error</td></tr>`;
            }
        }
    </script>
</body>
</html>

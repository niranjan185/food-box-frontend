    <script src="https://unpkg.com/leaflet/dist/leaflet.js"></script>

    <script src="profile.js"></script>
    <script>
    (()=>{
        // Fix default marker icon paths when using CDN (prevents 404s)
        if (window.L && L.Icon && L.Icon.Default) {
            L.Icon.Default.mergeOptions({
                iconRetinaUrl: 'https://unpkg.com/leaflet@1.9.4/dist/images/marker-icon-2x.png',
                iconUrl: 'https://unpkg.com/leaflet@1.9.4/dist/images/marker-icon.png',
                shadowUrl: 'https://unpkg.com/leaflet@1.9.4/dist/images/marker-shadow.png'
            });
        }
        const btn = document.getElementById('rest-choose-on-map');
        const modal = document.getElementById('restMapModal');
        const closeBtn = document.getElementById('restCloseMap');
        const searchInput = document.getElementById('restMapSearchInput');
        const searchBtn = document.getElementById('restMapSearchBtn');
        const confirmBtn = document.getElementById('restConfirmMap');
        const useBtn = document.getElementById('restUseCurrent');
        const badge = document.getElementById('rest-location-badge');
        const addrEl = document.getElementById('address');
        const latEl = document.getElementById('rest-lat');
        const lngEl = document.getElementById('rest-lng');

        let map=null, marker=null, selLat=null, selLng=null;

        function openModal(){ modal.style.display='flex'; setTimeout(initMap,10); }
        function closeModal(){ modal.style.display='none'; }

        function initMap(){
            if (!map){
                const startLat = parseFloat(latEl.value) || 17.385, startLng = parseFloat(lngEl.value) || 78.4867;
                map = L.map('restMap').setView([startLat, startLng], 13);
                L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', { attribution: '&copy; OpenStreetMap contributors' }).addTo(map);
                map.on('click', (e)=> setPoint(e.latlng.lat, e.latlng.lng));
            }
            if (latEl.value && lngEl.value){ setPoint(parseFloat(latEl.value), parseFloat(lngEl.value)); }
            if (navigator.geolocation){ navigator.geolocation.getCurrentPosition((pos)=>{ if(!latEl.value){ map.setView([pos.coords.latitude,pos.coords.longitude], 15); } }, ()=>{}, { enableHighAccuracy:true, timeout:6000 }); }
        }

        async function geocodeSearch(q){
            const query=(q||'').trim(); if (!query) return;
            const coordMatch=query.match(/^\s*(-?\d+(?:\.\d+)?)\s*,\s*(-?\d+(?:\.\d+)?)\s*$/);
            if (coordMatch){ return setPoint(parseFloat(coordMatch[1]), parseFloat(coordMatch[2])); }
            const params=new URLSearchParams({ q: query, limit:'3', addressdetails:'1', countrycodes:'in' });
            if (window.NOMINATIM_CONTACT_EMAIL) params.set('email', window.NOMINATIM_CONTACT_EMAIL);
            const resp=await fetch(`/webtechnologies/FoodBox/backend/api/utils/geocode_search.php?${params.toString()}`, { credentials:'include' });
            if (!resp.ok) { alert('Search failed'); return; }
            const results=await resp.json(); if (!Array.isArray(results) || results.length===0){ alert('No results'); return; }
            const best=results[0]; setPoint(parseFloat(best.lat), parseFloat(best.lon));
        }

        function setPoint(lat,lng){ selLat=lat; selLng=lng; if (!map) return; if (!marker){ marker=L.marker([lat,lng],{draggable:true}).addTo(map); marker.on('dragend', ev=>{ const p=ev.target.getLatLng(); selLat=p.lat; selLng=p.lng; }); } else { marker.setLatLng([lat,lng]); } map.setView([lat,lng], 16); }

        async function reverseFill(){
            if (selLat==null||selLng==null) return;
            const p=new URLSearchParams({ lat:String(selLat), lon:String(selLng) });
            if (window.NOMINATIM_CONTACT_EMAIL) p.set('email', window.NOMINATIM_CONTACT_EMAIL);
            const r=await fetch(`/webtechnologies/FoodBox/backend/api/utils/geocode_reverse.php?${p.toString()}`, { credentials:'include' });
            if (r.ok){ const j=await r.json(); const display=j && j.display_name ? j.display_name : `${selLat.toFixed(5)}, ${selLng.toFixed(5)}`; addrEl.value=display; badge.style.display='inline'; badge.textContent=`Location set (${selLat.toFixed(5)}, ${selLng.toFixed(5)})`; }
        }

        btn?.addEventListener('click', (e)=>{ e.preventDefault(); openModal(); });
        closeBtn?.addEventListener('click', (e)=>{ e.preventDefault(); closeModal(); });
        searchBtn?.addEventListener('click', (e)=>{ e.preventDefault(); geocodeSearch(searchInput.value); });
        searchInput?.addEventListener('keydown', (e)=>{ if (e.key==='Enter'){ e.preventDefault(); geocodeSearch(searchInput.value); } });
        useBtn?.addEventListener('click', (e)=>{ e.preventDefault(); if(!navigator.geolocation) return alert('Geolocation not available'); navigator.geolocation.getCurrentPosition((pos)=>{ setPoint(pos.coords.latitude,pos.coords.longitude); }, ()=> alert('Could not get your location'), { enableHighAccuracy:true, timeout:6000 }); });
        confirmBtn?.addEventListener('click', async (e)=>{ e.preventDefault(); if (selLat==null||selLng==null) return alert('Pick a location'); latEl.value=String(selLat); lngEl.value=String(selLng); await reverseFill(); closeModal(); });
    })();

    // Unread tickets badge
    (function(){
        async function refreshUnread(){
            try{
                const r = await fetch('/webtechnologies/FoodBox/backend/api/support/restaurant_notifications_count.php?type=support_ticket', { credentials: 'include' });
                const j = await r.json();
                const badge = document.getElementById('tickets-unread-badge');
                if (r.ok && j && j.success){
                    const c = parseInt(j.unread||0,10);
                    if (c>0){ badge.textContent = c>99?'99+':String(c); badge.style.display='inline-block'; }
                    else { badge.style.display='none'; }
                } else { badge.style.display='none'; }
            }catch(e){}
        }
        document.addEventListener('DOMContentLoaded', refreshUnread);
        setInterval(refreshUnread, 30000);
    })();
    </script>

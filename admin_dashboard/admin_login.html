<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Food Box Admin Login</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css" rel="stylesheet">
  <style>
    :root {
      --primary-orange: #ff7f27;
      --light-orange: #fff4e3;
    }

    body {
      background-color: var(--light-orange);
      font-family: 'Poppins', sans-serif;
    }

    .login-container {
      height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    .login-card {
      background-color: white;
      padding: 40px;
      border-radius: 15px;
      box-shadow: 0 8px 20px rgba(0,0,0,0.1);
      width: 100%;
      max-width: 400px;
    }

    .login-card h3 {
      color: var(--primary-orange);
      font-weight: 700;
      margin-bottom: 30px;
      text-align: center;
    }

    .btn-primary {
      background-color: var(--primary-orange);
      border: none;
    }

    .btn-primary:hover {
      background-color: #e46b0c;
    }
  </style>
</head>
<body>

  <div class="login-container">
    <div class="login-card">
      <h3>Admin Login</h3>
      <form id="adminLoginForm">
        <div class="mb-3">
          <label for="adminEmail" class="form-label">Email</label>
          <input type="email" class="form-control" id="adminEmail" placeholder="admin@foodbox.com" required>
        </div>
        <div class="mb-3">
          <label for="adminPassword" class="form-label">Password</label>
          <input type="password" class="form-control" id="adminPassword" placeholder="Enter password" required>
        </div>
        <button type="submit" class="btn btn-primary w-100">Login</button>
        <div id="loginMsg" class="mt-3 text-center text-danger"></div>
      </form>
    </div>
  </div>

  <script>
    // Predefined admin credentials
    const adminCreds = {
      email: "admin@foodbox.com",
      password: "Admin@123"
    };

    document.getElementById('adminLoginForm').addEventListener('submit', async function(e){
      e.preventDefault();
      const email = document.getElementById('adminEmail').value.trim();
      const password = document.getElementById('adminPassword').value.trim();
      const msg = document.getElementById('loginMsg');

      // Show loading state
      const submitBtn = this.querySelector('button[type="submit"]');
      const originalText = submitBtn.textContent;
      submitBtn.textContent = 'Logging in...';
      submitBtn.disabled = true;

      try {
        const response = await fetch('/webtechnologies/FoodBox/backend/api/admin_login.php', {
          method: 'POST',
          credentials: 'include',
          headers: {
            'Content-Type': 'application/x-www-form-urlencoded',
            'X-Requested-With': 'XMLHttpRequest'
          },
          body: `email=${encodeURIComponent(email)}&password=${encodeURIComponent(password)}`
        });

        const data = await response.json();

        if (data.success) {
          msg.textContent = '';
          alert('Login successful! Redirecting to dashboard...');
          window.location.href = "admin_dashboard.html"; // redirect to admin dashboard
        } else {
          msg.textContent = data.error || "Login failed!";
        }
      } catch (error) {
        console.error('Login error:', error);
        msg.textContent = "Network error. Please try again.";
      } finally {
        // Restore button state
        submitBtn.textContent = originalText;
        submitBtn.disabled = false;
      }
    });
  </script>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>

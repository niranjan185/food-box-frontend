<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Food Box - Delivery Partners</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css" rel="stylesheet">
  <style>
    :root {
      --primary-orange: #ff7f27;
      --light-orange: #fff4e3;
      --dark-orange: #e46b0c;
    }

    body {
      font-family: 'Poppins', sans-serif;
      background-color: var(--light-orange);
      color: #333;
    }

    .navbar {
      background-color: var(--primary-orange);
    }

    .navbar-brand {
      font-weight: bold;
      color: white !important;
      font-size: 1.5rem;
    }

    .sidebar {
      background-color: white;
      height: 100vh;
      position: fixed;
      top: 56px;
      left: 0;
      width: 240px;
      border-right: 1px solid #eee;
      padding-top: 20px;
    }

    .sidebar a {
      display: block;
      padding: 12px 20px;
      color: #555;
      text-decoration: none;
      font-weight: 500;
    }

    .sidebar a:hover, .sidebar a.active {
      background-color: var(--primary-orange);
      color: white;
      border-radius: 6px;
    }

    .content {
      margin-left: 260px;
      padding: 30px;
    }

    .table {
      border-radius: 10px;
      overflow: hidden;
      background-color: white;
      box-shadow: 0 3px 10px rgba(0,0,0,0.1);
    }

    .table thead {
      background-color: var(--primary-orange);
      color: white;
    }

    .search-bar input {
      border: 1px solid #ddd;
      border-radius: 20px;
      padding: 8px 15px;
      width: 300px;
    }

    .badge {
      font-size: 0.85rem;
    }
  </style>
</head>
<body>

  <!-- Navbar -->
  <nav class="navbar navbar-expand-lg navbar-dark fixed-top">
    <div class="container-fluid">
      <a class="navbar-brand" href="#">Food Box Admin</a>
    </div>
  </nav>

  <!-- Sidebar -->
  <div class="sidebar">
    <a href="admin_dashboard.html"><i class="bi bi-speedometer2 me-2"></i>Dashboard</a>
    <a href="restaurant_verification.html"><i class="bi bi-shop me-2"></i>Restaurants</a>
    <a href="customer.html"><i class="bi bi-people me-2"></i>Customers</a>
    <a href="delivery.html" class="active"><i class="bi bi-bicycle me-2"></i>Delivery Partners</a>
    <a href="earnings.html"><i class="bi bi-cash-coin me-2"></i>Earnings</a>
  </div>

  <!-- Content -->
  <div class="content">
    <div class="d-flex justify-content-between align-items-center mb-4">
      <h3 class="fw-bold text-dark-orange">Delivery Partner Management</h3>
      <div class="search-bar">
        <input type="text" id="searchDelivery" placeholder="Search by name or phone..." onkeyup="searchDeliveryPartners()">
      </div>
    </div>

    <div class="table-responsive">
      <table class="table align-middle">
        <thead>
          <tr>
            <th>#</th>
            <th>Name</th>
            <th>Email</th>
            <th>Phone</th>
            <th>Total Deliveries</th>
            <th>Rating</th>
            <th>Status</th>
            <th>Action</th>
          </tr>
        </thead>
        <tbody id="deliveryTable"></tbody>
      </table>
    </div>
  </div>

  <script>
    function renderRows(items) {
      return items.map((p, idx) => {
        const active = (String(p.is_active) === '1');
        const badge = active ? '<span class="badge bg-success">Active</span>' : '<span class="badge bg-danger">Inactive</span>';
        const btn = active ? '<button class="btn btn-sm btn-danger" data-action="deactivate">Deactivate</button>' : '<button class="btn btn-sm btn-success" data-action="activate">Activate</button>';
        return `
          <tr data-id="${p.id}">
            <td>${idx + 1}</td>
            <td>${p.full_name || '-'}</td>
            <td>${p.email || '-'}</td>
            <td>${p.phone || '-'}</td>
            <td>${p.total_deliveries ?? 0}</td>
            <td>${p.rating ?? '-'}</td>
            <td>${badge}</td>
            <td>${btn}</td>
          </tr>`;
      }).join('');
    }

    async function loadDeliveryPartners(q='') {
      const tbody = document.getElementById('deliveryTable');
      tbody.innerHTML = '<tr><td colspan="8" class="text-center text-muted">Loading...</td></tr>';
      try {
        const url = q ? `/webtechnologies/FoodBox/backend/api/admin/list_delivery_partners.php?q=${encodeURIComponent(q)}` : '/webtechnologies/FoodBox/backend/api/admin/list_delivery_partners.php';
        const resp = await fetch(url, { credentials: 'include' });
        const data = await resp.json();
        if (!resp.ok || !data.success) throw new Error(data.error || 'Failed to load');
        const items = data.partners || [];
        tbody.innerHTML = renderRows(items) || '<tr><td colspan="8" class="text-center text-muted">No delivery partners found.</td></tr>';
      } catch (e) {
        console.error('Load delivery partners failed', e);
        tbody.innerHTML = '<tr><td colspan="8" class="text-center text-danger">Failed to load delivery partners.</td></tr>';
      }
    }

    document.addEventListener('click', async (e) => {
      const btn = e.target.closest('button[data-action]');
      if (!btn) return;
      const row = btn.closest('tr');
      const id = parseInt(row?.dataset?.id || '0', 10);
      const action = btn.dataset.action; // activate | deactivate
      if (!id || !action) return;
      if (!confirm(`Are you sure you want to ${action} this partner?`)) return;
      try {
        const resp = await fetch('/webtechnologies/FoodBox/backend/api/admin/update_delivery_status.php', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          credentials: 'include',
          body: JSON.stringify({ delivery_id: id, action })
        });
        const out = await resp.json();
        if (!resp.ok || !out.success) throw new Error(out.error || 'Failed');
        // Refresh list after change
        const q = document.getElementById('searchDelivery').value.trim();
        await loadDeliveryPartners(q);
      } catch (err) {
        console.error('Update status failed', err);
        alert('Unable to update status');
      }
    });

    function searchDeliveryPartners() {
      const q = document.getElementById('searchDelivery').value.trim();
      loadDeliveryPartners(q);
    }

    document.addEventListener('DOMContentLoaded', () => loadDeliveryPartners());
  </script>

</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Food Box - Admin Earnings</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <style>
    :root {
      --primary-orange: #ff7f27;
      --light-orange: #fff4e3;
      --dark-orange: #e46b0c;
    }

    body {
      font-family: 'Poppins', sans-serif;
      background-color: var(--light-orange);
      color: #333;
    }

    .navbar {
      background-color: var(--primary-orange);
    }

    .navbar-brand {
      font-weight: bold;
      color: white !important;
      font-size: 1.5rem;
    }

    .sidebar {
      background-color: white;
      height: 100vh;
      position: fixed;
      top: 56px;
      left: 0;
      width: 240px;
      border-right: 1px solid #eee;
      padding-top: 20px;
    }

    .sidebar a {
      display: block;
      padding: 12px 20px;
      color: #555;
      text-decoration: none;
      font-weight: 500;
    }

    .sidebar a:hover, .sidebar a.active {
      background-color: var(--primary-orange);
      color: white;
      border-radius: 6px;
    }

    .content {
      margin-left: 260px;
      padding: 30px;
    }

    .card {
      border: none;
      border-radius: 15px;
      box-shadow: 0 4px 10px rgba(0, 0, 0, 0.1);
      transition: transform 0.3s ease;
    }

    .card:hover {
      transform: translateY(-5px);
    }

    .card-title {
      color: var(--dark-orange);
      font-weight: 600;
    }

    .earning-amount {
      font-size: 2rem;
      font-weight: bold;
      color: var(--primary-orange);
    }

    canvas {
      background: white;
      border-radius: 15px;
      box-shadow: 0 4px 8px rgba(0, 0, 0, 0.08);
      padding: 15px;
    }
  </style>
</head>
<body>

  <!-- Navbar -->
  <nav class="navbar navbar-expand-lg navbar-dark fixed-top">
    <div class="container-fluid">
      <a class="navbar-brand" href="#">Food Box Admin</a>
    </div>
  </nav>

  <!-- Sidebar -->
  <div class="sidebar">
    <a href="admin_dashboard.html"><i class="bi bi-speedometer2 me-2"></i>Dashboard</a>
    <a href="restaurant_verification.html"><i class="bi bi-shop me-2"></i>Restaurants</a>
    <a href="customer.html"><i class="bi bi-people me-2"></i>Customers</a>
    <a href="delivery.html"><i class="bi bi-bicycle me-2"></i>Delivery Partners</a>
    <a href="earnings.html" class="active"><i class="bi bi-cash-coin me-2"></i>Earnings</a>
  </div>

  <!-- Main Content -->
  <div class="content">
    <h2 class="mb-4 fw-bold text-orange">Earnings Overview</h2>

    <div class="row g-4">
      <div class="col-md-4">
        <div class="card p-3">
          <h5 class="card-title">Total Earnings</h5>
          <p class="earning-amount" id="totalEarnings">₹0</p>
          <small class="text-muted">All-time profit from commissions</small>
        </div>
      </div>
      <div class="col-md-4">
        <div class="card p-3">
          <h5 class="card-title">Monthly Earnings</h5>
          <p class="earning-amount" id="monthlyEarnings">₹0</p>
          <small class="text-muted">This month’s revenue</small>
        </div>
      </div>
      <div class="col-md-4">
        <div class="card p-3">
          <h5 class="card-title">Platform Commission</h5>
          <p class="earning-amount" id="avgCommission">0%</p>
          <small class="text-muted">Average per order</small>
        </div>
      </div>
    </div>

    <hr class="my-5">

    <div class="row">
      <div class="col-md-8">
        <h5 class="fw-semibold mb-3">Earnings Trend (Last 6 Months)</h5>
        <canvas id="earningsChart" height="120"></canvas>
      </div>

      <div class="col-md-4">
        <h5 class="fw-semibold mb-3">Earnings by Category</h5>
        <canvas id="categoryChart" height="120"></canvas>
      </div>
    </div>
  </div>

  <script>
    function formatINR(n) {
      try { return new Intl.NumberFormat('en-IN', { style: 'currency', currency: 'INR', maximumFractionDigits: 0 }).format(n); } catch { return n; }
    }

    async function loadEarnings() {
      try {
        const resp = await fetch('/webtechnologies/FoodBox/backend/api/admin/get_earnings.php', { credentials: 'include' });
        const out = await resp.json();
        if (!resp.ok || !out.success) throw new Error(out.error || 'Failed to load earnings');
        const d = out.data || {};
        const t = d.totals || {};
        document.getElementById('totalEarnings').textContent = formatINR(t.total_earnings || 0);
        document.getElementById('monthlyEarnings').textContent = formatINR(t.monthly_earnings || 0);
        const avg = t.avg_commission_per_order || 0;
        // Show average as percentage of average order if total_amount is present is unknown; display in currency per order
        document.getElementById('avgCommission').textContent = `${formatINR(avg)}/order`;

        // Line chart
        const labels = (d.monthly_series && d.monthly_series.labels) || [];
        const values = (d.monthly_series && d.monthly_series.values) || [];
        const ctx = document.getElementById('earningsChart').getContext('2d');
        new Chart(ctx, {
          type: 'line',
          data: {
            labels,
            datasets: [{
              label: 'Earnings (₹)',
              data: values,
              borderColor: '#ff7f27',
              backgroundColor: 'rgba(255, 127, 39, 0.2)',
              fill: true,
              tension: 0.4,
              borderWidth: 3
            }]
          },
          options: { responsive: true, plugins: { legend: { display: false } } }
        });

        // Category chart
        const cat = d.by_category || {};
        const categoryCtx = document.getElementById('categoryChart').getContext('2d');
        new Chart(categoryCtx, {
          type: 'doughnut',
          data: {
            labels: ['Restaurants/Customer', 'Delivery Commission', 'Other'],
            datasets: [{
              data: [cat.restaurant_commission || 0, cat.delivery_commission || 0, cat.other || 0],
              backgroundColor: ['#ff7f27', '#ffb347', '#ffe0c2'],
              borderWidth: 1
            }]
          },
          options: { responsive: true, plugins: { legend: { position: 'bottom' } } }
        });
      } catch (e) {
        console.error('Earnings load failed', e);
      }
    }

    document.addEventListener('DOMContentLoaded', loadEarnings);
  </script>
</body>
</html>

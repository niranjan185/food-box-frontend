<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Food Box - Admin Customers</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css" rel="stylesheet">
  <style>
    :root {
      --primary-orange: #ff7f27;
      --light-orange: #fff4e3;
      --dark-orange: #e46b0c;
    }

    body {
      font-family: 'Poppins', sans-serif;
      background-color: var(--light-orange);
      color: #333;
    }

    .navbar {
      background-color: var(--primary-orange);
    }

    .navbar-brand {
      font-weight: bold;
      color: white !important;
      font-size: 1.5rem;
    }

    .sidebar {
      background-color: white;
      height: 100vh;
      position: fixed;
      top: 56px;
      left: 0;
      width: 240px;
      border-right: 1px solid #eee;
      padding-top: 20px;
    }

    .sidebar a {
      display: block;
      padding: 12px 20px;
      color: #555;
      text-decoration: none;
      font-weight: 500;
    }

    .sidebar a:hover, .sidebar a.active {
      background-color: var(--primary-orange);
      color: white;
      border-radius: 6px;
    }

    .content {
      margin-left: 260px;
      padding: 30px;
    }

    .table {
      border-radius: 10px;
      overflow: hidden;
      background-color: white;
      box-shadow: 0 3px 10px rgba(0,0,0,0.1);
    }

    .table thead {
      background-color: var(--primary-orange);
      color: white;
    }

    .search-bar input {
      border: 1px solid #ddd;
      border-radius: 20px;
      padding: 8px 15px;
      width: 300px;
    }

    .badge {
      font-size: 0.85rem;
    }
  </style>
</head>
<body>

  <!-- Navbar -->
  <nav class="navbar navbar-expand-lg navbar-dark fixed-top">
    <div class="container-fluid">
      <a class="navbar-brand" href="#">Food Box Admin</a>
    </div>
  </nav>

  <!-- Sidebar -->
  <div class="sidebar">
    <a href="admin_dashboard.html"><i class="bi bi-speedometer2 me-2"></i>Dashboard</a>
    <a href="restaurant_verification.html"><i class="bi bi-shop me-2"></i>Restaurants</a>
    <a href="customer.html" class="active"><i class="bi bi-people me-2"></i>Customers</a>
    <a href="delivery.html"><i class="bi bi-bicycle me-2"></i>Delivery Partners</a>
    <a href="earnings.html"><i class="bi bi-cash-coin me-2"></i>Earnings</a>
  </div>

  <!-- Content -->
  <div class="content">
    <div class="d-flex justify-content-between align-items-center mb-4">
      <h3 class="fw-bold text-dark-orange">Customer Management</h3>
      <div class="search-bar">
        <input type="text" id="searchCustomer" placeholder="Search by name or email..." onkeyup="searchCustomers()">
      </div>
    </div>

    <div class="table-responsive">
      <table class="table align-middle">
        <thead>
          <tr>
            <th>#</th>
            <th>Customer Name</th>
            <th>Email</th>
            <th>Phone</th>
            <th>Total Orders</th>
            <th>Total Spent (₹)</th>
            <th>Status</th>
          </tr>
        </thead>
        <tbody id="customerTable"></tbody>
      </table>
    </div>
  </div>

  <script>
    function formatINR(n) {
      try { return new Intl.NumberFormat('en-IN', { maximumFractionDigits: 0 }).format(n); } catch { return n; }
    }

    async function loadCustomers(q = '') {
      const tbody = document.getElementById('customerTable');
      tbody.innerHTML = '<tr><td colspan="7" class="text-center text-muted">Loading...</td></tr>';
      try {
        const url = q ? `/webtechnologies/FoodBox/backend/api/admin/list_customers.php?q=${encodeURIComponent(q)}` : '/webtechnologies/FoodBox/backend/api/admin/list_customers.php';
        const resp = await fetch(url, { credentials: 'include' });
        const data = await resp.json();
        if (!resp.ok || !data.success) throw new Error(data.error || 'Failed to load');
        const rows = (data.customers || []).map((c, idx) => {
          const statusBadge = '<span class="badge bg-success">Active</span>';
          return `
            <tr>
              <td>${idx + 1}</td>
              <td>${c.full_name || '-'}</td>
              <td>${c.email || '-'}</td>
              <td>${c.phone || '-'}</td>
              <td>${c.total_orders ?? 0}</td>
              <td>${formatINR(c.total_spent ?? 0)}</td>
              <td>${statusBadge}</td>
            </tr>`;
        }).join('');
        tbody.innerHTML = rows || '<tr><td colspan="7" class="text-center text-muted">No customers found.</td></tr>';
      } catch (e) {
        console.error('Load customers failed', e);
        tbody.innerHTML = '<tr><td colspan="7" class="text-center text-danger">Failed to load customers.</td></tr>';
      }
    }

    function searchCustomers() {
      const q = document.getElementById('searchCustomer').value.trim();
      loadCustomers(q);
    }

    document.addEventListener('DOMContentLoaded', () => loadCustomers());
  </script>

</body>
</html>
